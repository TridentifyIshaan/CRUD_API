# AI version (Task 3) — quarantined stack. Uses its own project name, ports
# (API 8001, Postgres 5433) and volume so it never collides with the hand-built
# stack in ../compose.yaml. Credentials come from the root .env:
#   docker compose -f ai-version/compose.yaml --env-file .env up --build
name: crud-api-ai

services:
  api:
    build:
      context: ..
      dockerfile: ai-version/Dockerfile
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - ai_taskdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  ai_taskdata:
