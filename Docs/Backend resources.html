          title: &quot;Docker-managed storage outlives an individual container&quot;,
          text: &quot;A volume is mounted at a path inside the container, but has its own lifecycle. Recreate the Postgres container with the same volume and the database files remain. Treat volume removal as data deletion; docker compose down -v intentionally removes named volumes.&quot;,

      let cacheHasCopy = false;
      const cacheMessage = document.getElementById(&quot;cache-message&quot;);
      const cacheRequest = document.getElementById(&quot;cache-request&quot;);
      const cacheClear = document.getElementById(&quot;cache-clear&quot;);

      if (cacheRequest &amp;&amp; cacheMessage) {
        cacheRequest.addEventListener(&quot;click&quot;, function () {
          if (cacheHasCopy) {
            cacheMessage.className = &quot;cache-message hit&quot;;

              &quot;&lt;b&gt;HIT · fast path:&lt;/b&gt; the answer is already in the cache, so the request returns the copy without repeating the database work.&quot;;

            cacheHasCopy = true;
            cacheMessage.className = &quot;cache-message miss&quot;;
            cacheMessage.innerHTML =
              &quot;&lt;b&gt;MISS · slow path:&lt;/b&gt; no copy exists. Read the database, build the answer, return it, and save a temporary copy for the next request.&quot;;
          }
        });
      }

      if (cacheClear &amp;&amp; cacheMessage) {
        cacheClear.addEventListener(&quot;click&quot;, function () {
          cacheHasCopy = false;
          cacheMessage.className = &quot;cache-message&quot;;
          cacheMessage.innerHTML =
            &quot;&lt;b&gt;Cache cleared:&lt;/b&gt; the copy expired or was invalidated. The next request will be a miss again.&quot;;

      const resCount = document.getElementById(&quot;rescount&quot;);

      function renderResources() {
        const slideNumber = current + 1;
        const list = resources[slideNumber] || [];
        resCount.textContent = String(list.length);
        resTitle.textContent =
          slideNumber + &quot; · &quot; + slides[current].dataset.nav;
        let html =
          &#x27;&lt;div class=&quot;res-legend&quot;&gt;&lt;span class=&quot;level-dot green&quot;&gt;&lt;/span&gt;start here &amp;nbsp; &lt;span class=&quot;level-dot yellow&quot;&gt;&lt;/span&gt;when comfortable &amp;nbsp; &lt;span class=&quot;level-dot red&quot;&gt;&lt;/span&gt;optional deep dive&lt;br&gt;All resources are free. No credit card required. External links need internet.&lt;/div&gt;&#x27;;
        list.forEach(function (item) {
          const level = resourceLevels[item[0]];
          html +=
            &#x27;&lt;a class=&quot;res-item&quot; href=&quot;&#x27; +
            item[2] +
            &#x27;&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;&#x27;;
          html +=
            &#x27;&lt;div class=&quot;res-title&quot;&gt;&lt;span class=&quot;level-dot &#x27; +
            level[0] +
            &#x27;&quot;&gt;&lt;/span&gt;&#x27; +
            item[1] +
            &#x27;&lt;span class=&quot;ext&quot;&gt;↗&lt;/span&gt;&lt;/div&gt;&#x27;;
          html += &#x27;&lt;div class=&quot;res-meta&quot;&gt;&#x27; + item[3] + &quot;&lt;/div&gt;&lt;/a&gt;&quot;;
        });
        resBody.innerHTML = html;
      }

      function toggleResources(force) {
        if (typeof force === &quot;boolean&quot;) {
          drawer.classList.toggle(&quot;open&quot;, force);
        } else {
          drawer.classList.toggle(&quot;open&quot;);
        }
      }

      document.getElementById(&quot;resbtn&quot;).addEventListener(&quot;click&quot;, function () {
        toggleResources();
      });

      document
        .getElementById(&quot;resclose&quot;)
        .addEventListener(&quot;click&quot;, function () {
          toggleResources(false);
        });

      document.addEventListener(&quot;click&quot;, function (event) {
        const resButton = document.getElementById(&quot;resbtn&quot;);
        if (
          drawer.classList.contains(&quot;open&quot;) &amp;&amp;
          !drawer.contains(event.target) &amp;&amp;
          !resButton.contains(event.target)
        ) {
          toggleResources(false);
        }
      });

      document.addEventListener(&quot;keydown&quot;, function (event) {
        if ([&quot;INPUT&quot;, &quot;SELECT&quot;, &quot;TEXTAREA&quot;].includes(event.target.tagName))
          return;
        if (
          event.key === &quot;ArrowRight&quot; ||
          event.key === &quot;PageDown&quot; ||
          event.key === &quot; &quot;
        ) {
          event.preventDefault();
          show(current + 1);
        } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;PageUp&quot;) {
          event.preventDefault();
          show(current - 1);
        } else if (event.key === &quot;Home&quot;) {
          show(0);
        } else if (event.key === &quot;End&quot;) {
          show(slides.length - 1);
        } else if (event.key.toLowerCase() === &quot;n&quot;) {
          notes.classList.toggle(&quot;show&quot;);
        } else if (event.key.toLowerCase() === &quot;r&quot;) {
          toggleResources();
        } else if (event.key.toLowerCase() === &quot;f&quot;) {
          document.getElementById(&quot;toggle-full&quot;).click();
        } else if (event.key === &quot;+&quot; || event.key === &quot;=&quot;) {
          setZoom(zoom + 0.1);
        } else if (event.key === &quot;-&quot; || event.key === &quot;_&quot;) {
          setZoom(zoom - 0.1);
        } else if (event.key === &quot;Escape&quot;) {
          slides[current]
            .querySelectorAll(&quot;.selectable-box.is-selected&quot;)
            .forEach(function (box) {
              box.classList.remove(&quot;is-selected&quot;);
              box.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
            });
          toggleResources(false);
        }
      });

      setZoom(zoom);
      const hashSlide = Number(location.hash.slice(1));
      show(Number.isFinite(hashSlide) &amp;&amp; hashSlide &gt; 0 ? hashSlide - 1 : 0);
    &lt;/script&gt;

t.forEach(x=>x.onclick=()=>go(+x.dataset.i));go(0);
