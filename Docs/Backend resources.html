    &lt;script&gt;
      /* ================= SLIDES ================= */
      const CH = {
        F: &quot;Foundations&quot;,
        L: &quot;The loop up close&quot;,
        T: &quot;See it live&quot;,
        A: &quot;APIs &amp; beyond&quot;,
        Y: &quot;The project&quot;,
      };
      const esc = (s) =&gt; s.replace(/&amp;/g, &quot;&amp;amp;&quot;).replace(/&lt;/g, &quot;&amp;lt;&quot;);
      const slides = [];
      const S = (chapter, nav, kick, title, body, notes) =&gt;
        slides.push({ chapter, nav, kick, title, body, notes });

      /* 1 · Title */
      (S(
        CH.F,
        &quot;Welcome&quot;,
        &quot;FlyRank.ai · AI Backend Engineering&quot;,
        &quot;Backend 101 — How the Web Works&quot;,
        `
  &lt;p class=&quot;sub&quot;&gt;Concepts + live demos · No prior experience needed&lt;/p&gt;
  &lt;div class=&quot;strip&quot;&gt;&lt;b&gt;Overview:&lt;/b&gt; what really happens when you open a website — clients, servers, URLs, HTTP, requests and responses — leading straight into the project: &lt;b&gt;build a CRUD Task API&lt;/b&gt;.&lt;/div&gt;
  &lt;p class=&quot;bl&quot;&gt;Use &lt;b&gt;← →&lt;/b&gt; or a clicker to move · &lt;b&gt;N&lt;/b&gt; for speaker notes · &lt;b&gt;F&lt;/b&gt; for fullscreen.&lt;/p&gt;`,
        &quot;Frame: the foundation for everything that follows, and it ends inside the project. We skip cables-and-packets theory on purpose — resource list §1 has under-the-hood reads.&quot;,
      ),
        /* 2 · Clients &amp; servers */
        S(
          CH.F,
          &quot;Clients &amp; servers&quot;,
          &quot;The two roles&quot;,
          &quot;Clients ask. Servers answer.&quot;,
          `
  &lt;p class=&quot;sub&quot;&gt;The whole web is a restaurant — and this picture is the entire deck in one slide.&lt;/p&gt;
  &lt;div class=&quot;arrowflow&quot;&gt;
    &lt;div class=&quot;card&quot; style=&quot;text-align:center; min-width:200px;&quot;&gt;&lt;div class=&quot;ico&quot;&gt;🧑&lt;/div&gt;&lt;h3 class=&quot;g&quot;&gt;YOU — the client&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;You pick from the menu and place an order&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ar&quot;&gt;→&lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;text-align:center; min-width:200px;&quot;&gt;&lt;div class=&quot;ico&quot;&gt;📋&lt;/div&gt;&lt;h3 class=&quot;g&quot;&gt;THE ORDER — a request&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;Carried to the kitchen, written in a fixed format&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ar&quot;&gt;→&lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;text-align:center; min-width:200px;&quot;&gt;&lt;div class=&quot;ico&quot;&gt;👨‍🍳&lt;/div&gt;&lt;h3 class=&quot;g&quot;&gt;THE KITCHEN — the server&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;Always open, prepares the answer to every order&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p style=&quot;text-align:center; color:var(--mut); font-size:13px;&quot;&gt;←  the meal comes back — that&#x27;s the &lt;b style=&quot;color:var(--txt)&quot;&gt;response&lt;/b&gt;&lt;/p&gt;
  &lt;div class=&quot;strip&quot;&gt;&lt;b&gt;A client is anything that asks:&lt;/b&gt; your browser · a phone app · curl · Swagger UI · even another server.&lt;/div&gt;`,
          &quot;The most important slide of the day — say so. Client is a ROLE, not a device. Chat prompt: when your phone shows the weather, who is the client?&quot;,
        ),
        /* 3 · FE/BE */
        S(
          CH.F,
          &quot;Frontend vs backend&quot;,
          &quot;Where the code lives&quot;,
          &quot;Frontend and backend — two halves, one loop&quot;,
          `
  &lt;div class=&quot;cards c2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ico&quot;&gt;📱&lt;/div&gt;&lt;h3&gt;Frontend — on your device&lt;/h3&gt;&lt;p&gt;Buttons, colors, text — everything you can see and touch. Runs in the browser or the app.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card hl&quot;&gt;&lt;div class=&quot;ico&quot;&gt;🗄️&lt;/div&gt;&lt;h3 class=&quot;g&quot;&gt;Backend — on a server&lt;/h3&gt;&lt;p&gt;Data, rules, passwords — everything you have to trust. Runs on a machine you never see. Decides what&#x27;s allowed.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;strip&quot;&gt;&lt;b&gt;One tap, one loop — Instagram:&lt;/b&gt; you tap the ♥ (frontend) → it sends &lt;span class=&quot;mono&quot;&gt;POST /likes&lt;/span&gt; → the backend checks you&#x27;re allowed, saves it → responds &lt;span class=&quot;ok mono&quot;&gt;201&lt;/span&gt; → the heart turns red (frontend again).&lt;/div&gt;
  &lt;p class=&quot;bl&quot;&gt;&lt;b&gt;They only ever talk through requests and responses.&lt;/b&gt; &lt;span class=&quot;g&quot;&gt;This project builds the answering half.&lt;/span&gt;&lt;/p&gt;`,
          &quot;Show them CONNECTED, not just split. Walk the like-button loop slowly. Chat: what else must the backend check before saving a like? (logged in? already liked? blocked?)&quot;,
        ),
        /* 4 · URL anatomy (interactive) */
        S(
          CH.F,
          &quot;Anatomy of a URL&quot;,
          &quot;The address&quot;,
          &quot;Anatomy of a URL — read any address&quot;,
          `
  &lt;p class=&quot;sub&quot;&gt;Click any part — every one has a small job. First the project&#x27;s address, then the same address out in the real world.&lt;/p&gt;
  &lt;p class=&quot;bl&quot; style=&quot;margin:0 0 6px;&quot;&gt;&lt;b&gt;While you build:&lt;/b&gt;&lt;/p&gt;
  &lt;div class=&quot;urlbox&quot; id=&quot;urlbox&quot;&gt;
    &lt;span class=&quot;seg mono&quot; data-k=&quot;protocol&quot;&gt;http://&lt;/span&gt;&lt;span class=&quot;seg mono&quot; data-k=&quot;domain&quot;&gt;localhost&lt;/span&gt;&lt;span class=&quot;seg mono&quot; data-k=&quot;port&quot;&gt;:3000&lt;/span&gt;&lt;span class=&quot;seg mono&quot; data-k=&quot;path&quot;&gt;/tasks/3&lt;/span&gt;&lt;span class=&quot;seg mono&quot; data-k=&quot;query&quot;&gt;?done=true&lt;/span&gt;
  &lt;/div&gt;

  &lt;div class=&quot;cards c2&quot;&gt;
    &lt;div class=&quot;card hl&quot;&gt;&lt;div class=&quot;ico&quot;&gt;📖&lt;/div&gt;&lt;h3 class=&quot;g&quot;&gt;What is a protocol?&lt;/h3&gt;&lt;p&gt;When two strangers talk, they follow shared rules: greet, take turns, say goodbye.&lt;br&gt;&lt;br&gt;A protocol is exactly that — conversation rules, &lt;b&gt;written down&lt;/b&gt; — so any two computers can understand each other, with no introductions needed.&lt;/p&gt;&lt;/div&gt;
    &lt;div&gt;
      &lt;div class=&quot;card&quot; style=&quot;margin-bottom:10px;&quot;&gt;&lt;h3 class=&quot;g&quot; style=&quot;font-size:12px;&quot;&gt;HTTP&lt;/h3&gt;&lt;p&gt;HyperText Transfer Protocol — the web&#x27;s rule book: how a request must look, how a response must look, what the codes mean.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;margin-bottom:10px;&quot;&gt;&lt;h3 class=&quot;g&quot; style=&quot;font-size:12px;&quot;&gt;WHY IT WORKS&lt;/h3&gt;&lt;p&gt;Everyone follows the same rules — so a phone in Brazil can talk to a server in Japan, first try, every time.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h3 class=&quot;g&quot; style=&quot;font-size:12px;&quot;&gt;HTTPS&lt;/h3&gt;&lt;p&gt;The same rules inside a locked envelope — everything encrypted on the way. That&#x27;s the lock icon in your browser.&lt;/p&gt;&lt;/div&gt;

      #main {

        from {
          opacity: 0;
          transform: translateY(5px);

        to {
          opacity: 1;
          transform: translateY(0);

        gap: 9px;

        text-transform: uppercase;

        height: 11px;
        background: var(--acc);

      h1 {

        margin-bottom: 9px;

      .sub {
        max-width: 940px;
        margin-bottom: 20px;

        line-height: 1.5;

        display: grid;
        gap: 14px;
        margin: 14px 0;

      .c2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .c3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .c4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));

      .card {
        position: relative;
        min-width: 0;
        padding: 16px;
        border: 1px solid var(--card-border);
        border-radius: 12px;
        outline: none;
        background:
          linear-gradient(145deg, rgb(255 255 255 / 2.5%), transparent 45%),

        box-shadow: 0 7px 18px rgb(0 0 0 / 10%);
        cursor: pointer;
        transition:
          border-color 0.18s ease,
          background-color 0.18s ease,
          box-shadow 0.18s ease,
          transform 0.18s ease;
      }

      .card:hover {
        border-color: var(--card-border-hover);
        background:
          linear-gradient(145deg, rgb(108 221 155 / 5%), transparent 46%),
          var(--card);
        box-shadow: 0 10px 24px rgb(0 0 0 / 17%);
        transform: translateY(-2px);
      }

      .card:focus-visible {
        border-color: var(--acc);
        box-shadow:
          0 0 0 3px rgb(108 221 155 / 15%),
          0 10px 24px rgb(0 0 0 / 17%);
      }

      .card.is-selected {
        border-color: var(--acc);
        background:
          linear-gradient(145deg, rgb(108 221 155 / 12%), transparent 52%),
          var(--card);
        box-shadow:
          inset 0 0 0 1px rgb(108 221 155 / 12%),
          0 12px 28px rgb(0 0 0 / 21%);
        transform: translateY(-2px);
      }

      .card.hl,
      .card.warn,
      .card.err {
        border-color: var(--card-border);
      }

      .card.hl {
        background:
          linear-gradient(145deg, rgb(255 255 255 / 2.5%), transparent 45%),
          var(--card);
      }

      .card.warn {
        background:
          linear-gradient(145deg, rgb(255 255 255 / 2.5%), transparent 45%),
          var(--card);
      }

      .card.err {
        background:
          linear-gradient(145deg, rgb(255 255 255 / 2.5%), transparent 45%),
          var(--card);
      }

      .selectable-box:not(.card) {
        position: relative;
        outline: none;
        box-shadow: inset 0 0 0 1px var(--card-border);
        cursor: pointer;
        transition:
          border-color 0.18s ease,
          box-shadow 0.18s ease,
          transform 0.18s ease;
      }

      .terminal.selectable-box,
      .layer.selectable-box {
        border-color: var(--card-border);
      }

      .selectable-box:not(.card):hover {
        border-color: var(--card-border-hover);
        box-shadow:
          inset 0 0 0 1px var(--card-border-hover),
          0 9px 22px rgb(0 0 0 / 16%);
        transform: translateY(-1px);
      }

      .selectable-box:not(.card):focus-visible {
        border-color: var(--acc);
        box-shadow:
          inset 0 0 0 1px var(--acc),
          0 0 0 3px rgb(108 221 155 / 15%);
      }

      .selectable-box:not(.card).is-selected {
        border-color: var(--acc);
        box-shadow:
          inset 0 0 0 2px var(--acc),
          0 11px 26px rgb(0 0 0 / 20%);
        transform: translateY(-1px);

      .r {

        content: &quot;✓&quot;;

        &lt;div id=&quot;progress&quot;&gt;&lt;div id=&quot;bar&quot;&gt;&lt;/div&gt;&lt;/div&gt;

        &lt;div id=&quot;stage&quot;&gt;
          &lt;section class=&quot;slide&quot; data-chapter=&quot;Start here&quot; data-nav=&quot;Welcome&quot;&gt;
            &lt;div class=&quot;title-logo&quot;&gt;
              Fl&lt;span class=&quot;y&quot;&gt;y&lt;/span&gt;Rank&lt;sup&gt;AI&lt;/sup&gt;
            &lt;/div&gt;
            &lt;div class=&quot;kick&quot;&gt;Backend Development Track&lt;/div&gt;
            &lt;h1&gt;The tools around your code&lt;/h1&gt;
            &lt;p class=&quot;sub&quot;&gt;
              A friendly tour of the tools every developer meets · every
              language and experience level welcome
            &lt;/p&gt;
            &lt;div class=&quot;strip welcome-promise&quot;&gt;
              This kit is &lt;b&gt;not about memorising commands&lt;/b&gt;. It is about
              understanding the words and tools you will hear again and again—so
              “push it to GitHub,” “connect the database,” or “run it in Docker”
              starts to make sense.
            &lt;/div&gt;
            &lt;p class=&quot;welcome-close&quot;&gt;
              By the end, you should recognise the tools, understand the job
              each one does, and know where to continue learning.
            &lt;/p&gt;
            &lt;p class=&quot;bottom-line&quot;&gt;
              Use &lt;b&gt;← →&lt;/b&gt; or a presenter clicker · &lt;b&gt;N&lt;/b&gt; notes ·
              &lt;b&gt;R&lt;/b&gt; resources · &lt;b&gt;F&lt;/b&gt; fullscreen · &lt;b&gt;+ / −&lt;/b&gt; zoom
            &lt;/p&gt;
            &lt;div class=&quot;speaker-notes&quot;&gt;
              2 min. Welcome everyone. Explain that this is a relaxed concepts
              session, not a coding test. The goal is recognition and context:
              what each tool does, why developers use it, and where interns can
              learn more when a project needs it.
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section
            class=&quot;slide&quot;
            data-chapter=&quot;Start here&quot;
            data-nav=&quot;The map&quot;
          &gt;
            &lt;div class=&quot;kick&quot;&gt;The route&lt;/div&gt;
            &lt;h1&gt;Six ideas connect the whole backend workflow&lt;/h1&gt;
            &lt;p class=&quot;sub&quot;&gt;
              We will move from the tools closest to your code to the services
              that store, run, and speed up your application.
            &lt;/p&gt;
            &lt;div class=&quot;cards c3 topic-map&quot;&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;
                &lt;h3 style=&quot;display: inline&quot;&gt;Terminal&lt;/h3&gt;
                &lt;p class=&quot;cap&quot; style=&quot;margin-top: 8px&quot;&gt;

              &lt;/div&gt;

                &lt;/p&gt;
              &lt;/div&gt;

                &lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;
                &lt;h3 style=&quot;display: inline&quot;&gt;Docker&lt;/h3&gt;
                &lt;p class=&quot;cap&quot; style=&quot;margin-top: 8px&quot;&gt;

                &lt;/p&gt;
              &lt;/div&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;num&quot;&gt;6&lt;/span&gt;

          &lt;section
            class=&quot;slide&quot;

          &gt;
            &lt;div class=&quot;kick&quot;&gt;Control the project&lt;/div&gt;
            &lt;h1&gt;The terminal is a text interface to your computer&lt;/h1&gt;
            &lt;p class=&quot;sub&quot;&gt;
              You type an instruction, the shell runs it, and the terminal shows
              the result. It is the same project—just without buttons and menus.
            &lt;/p&gt;
            &lt;div class=&quot;cards c2&quot;&gt;
              &lt;div class=&quot;terminal&quot;&gt;
                &lt;div class=&quot;term-head&quot;&gt;
                  &lt;span class=&quot;term-dot&quot;&gt;&lt;/span&gt;&lt;span class=&quot;term-dot&quot;&gt;&lt;/span
                  &gt;&lt;span class=&quot;term-dot&quot;&gt;&lt;/span
                  &gt;&lt;span class=&quot;term-title&quot;&gt;macOS / Linux shell&lt;/span&gt;
                &lt;/div&gt;
                &lt;pre
                  class=&quot;code&quot;
                &gt;&lt;span class=&quot;prompt&quot;&gt;$&lt;/span&gt; pwd                       &lt;span class=&quot;comment&quot;&gt;# current folder&lt;/span&gt;
&lt;span class=&quot;prompt&quot;&gt;$&lt;/span&gt; ls                        &lt;span class=&quot;comment&quot;&gt;# list files&lt;/span&gt;
&lt;span class=&quot;prompt&quot;&gt;$&lt;/span&gt; cd task-api               &lt;span class=&quot;comment&quot;&gt;# enter a folder&lt;/span&gt;
&lt;span class=&quot;prompt&quot;&gt;$&lt;/span&gt; mkdir src                 &lt;span class=&quot;comment&quot;&gt;# create a folder&lt;/span&gt;
&lt;span class=&quot;prompt&quot;&gt;$&lt;/span&gt; touch src/server.js       &lt;span class=&quot;comment&quot;&gt;# create a file&lt;/span&gt;
&lt;span class=&quot;prompt&quot;&gt;$&lt;/span&gt; npm install               &lt;span class=&quot;comment&quot;&gt;# Node packages&lt;/span&gt;
&lt;span class=&quot;prompt&quot;&gt;$&lt;/span&gt; pip install -r requirements.txt
&lt;span class=&quot;prompt&quot;&gt;$&lt;/span&gt; python app.py&lt;/pre&gt;
              &lt;/div&gt;
              &lt;div class=&quot;terminal&quot;&gt;
                &lt;div class=&quot;term-head&quot;&gt;
                  &lt;span class=&quot;term-dot&quot;&gt;&lt;/span&gt;&lt;span class=&quot;term-dot&quot;&gt;&lt;/span
                  &gt;&lt;span class=&quot;term-dot&quot;&gt;&lt;/span
                  &gt;&lt;span class=&quot;term-title&quot;&gt;Windows PowerShell&lt;/span&gt;
                &lt;/div&gt;
                &lt;pre
                  class=&quot;code&quot;
                &gt;&lt;span class=&quot;prompt&quot;&gt;PS&amp;gt;&lt;/span&gt; Get-Location             &lt;span class=&quot;comment&quot;&gt;# current folder&lt;/span&gt;
&lt;span class=&quot;prompt&quot;&gt;PS&amp;gt;&lt;/span&gt; Get-ChildItem            &lt;span class=&quot;comment&quot;&gt;# list files&lt;/span&gt;
&lt;span class=&quot;prompt&quot;&gt;PS&amp;gt;&lt;/span&gt; Set-Location task-api    &lt;span class=&quot;comment&quot;&gt;# enter a folder&lt;/span&gt;
&lt;span class=&quot;prompt&quot;&gt;PS&amp;gt;&lt;/span&gt; New-Item -ItemType Directory src
&lt;span class=&quot;prompt&quot;&gt;PS&amp;gt;&lt;/span&gt; New-Item src/server.js
&lt;span class=&quot;prompt&quot;&gt;PS&amp;gt;&lt;/span&gt; npm install
&lt;span class=&quot;prompt&quot;&gt;PS&amp;gt;&lt;/span&gt; pip install -r requirements.txt
&lt;span class=&quot;prompt&quot;&gt;PS&amp;gt;&lt;/span&gt; python app.py&lt;/pre&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;strip&quot;&gt;
              &lt;b&gt;What may look different:&lt;/b&gt; Windows commonly uses PowerShell
              or Git Bash; macOS and Linux commonly use a Unix-style shell.
              Project commands such as &lt;span class=&quot;mono&quot;&gt;git&lt;/span&gt;,
              &lt;span class=&quot;mono&quot;&gt;npm&lt;/span&gt;, &lt;span class=&quot;mono&quot;&gt;pip&lt;/span&gt;, and
              &lt;span class=&quot;mono&quot;&gt;python&lt;/span&gt; are mostly the same once
              installed.
            &lt;/div&gt;
            &lt;p class=&quot;bottom-line&quot;&gt;
              Do not memorise the list. Read the folder in the prompt, run one
              unfamiliar command at a time, and use
              &lt;span class=&quot;mono&quot;&gt;--help&lt;/span&gt; when you need it.
            &lt;/p&gt;
            &lt;div class=&quot;speaker-notes&quot;&gt;
              5 min. Define terminal, shell, and command in one sentence each,
              without turning this into operating-system theory. Point out the
              visual difference between a dollar-sign prompt and a PowerShell
              prompt. Run pwd or Get-Location, list the folder, and show one
              project command if doing a live demo.
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section
            class=&quot;slide&quot;
            data-chapter=&quot;Project basics&quot;
            data-nav=&quot;Git and GitHub&quot;
          &gt;
            &lt;div class=&quot;kick&quot;&gt;Two names, two jobs&lt;/div&gt;
            &lt;h1&gt;Git is not GitHub&lt;/h1&gt;
            &lt;p class=&quot;sub&quot;&gt;
              Git records history on your computer. GitHub is one online place
              where Git repositories can be stored, shared, and reviewed.
            &lt;/p&gt;
            &lt;div class=&quot;cards c3&quot;&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;&gt;Git&lt;/span&gt;
                &lt;h3&gt;The version-control tool&lt;/h3&gt;
                &lt;p&gt;
                  It records commits, creates branches, and compares changes. It
                  works locally—even without internet access.
                &lt;/p&gt;
              &lt;/div&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;&gt;GitHub&lt;/span&gt;
                &lt;h3&gt;A repository host&lt;/h3&gt;
                &lt;p&gt;
                  It stores a remote copy and adds pull requests, review,
                  issues, automation, and team access.
                &lt;/p&gt;
              &lt;/div&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;&gt;Alternatives&lt;/span&gt;
                &lt;h3&gt;Same Git, another platform&lt;/h3&gt;
                &lt;p&gt;
                  GitLab, Bitbucket, Codeberg, and private company servers can
                  host the same kind of Git repository.
                &lt;/p&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;stack&quot;&gt;
              &lt;div class=&quot;layer&quot;&gt;
                &lt;strong&gt;Your computer&lt;/strong
                &gt;&lt;span&gt;working files → Git commits&lt;/span&gt;
              &lt;/div&gt;
              &lt;div class=&quot;arrow&quot;&gt;⇄&lt;/div&gt;
              &lt;div class=&quot;layer&quot;&gt;
                &lt;strong&gt;Remote platform&lt;/strong
                &gt;&lt;span
                  &gt;GitHub, GitLab, Bitbucket, Codeberg, or private hosting&lt;/span
                &gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;p class=&quot;bottom-line&quot;&gt;
              If GitHub disappeared, Git would still work. Your local repository
              already contains its history.
            &lt;/p&gt;
            &lt;div class=&quot;speaker-notes&quot;&gt;
              4 min. Make the difference explicit. Git is the technology; GitHub
              is a product built around it. The knowledge transfers to other
              hosts. A commit is a local checkpoint. Push sends commits to the
              remote platform.
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section
            class=&quot;slide&quot;
            data-chapter=&quot;Project basics&quot;
            data-nav=&quot;Useful commits&quot;
          &gt;
            &lt;div class=&quot;kick&quot;&gt;Save work you can explain&lt;/div&gt;
            &lt;h1&gt;Small commits make changes easier to understand&lt;/h1&gt;
            &lt;p class=&quot;sub&quot;&gt;
              A commit is not “I am completely finished.” It is a named
              checkpoint containing one understandable change.
            &lt;/p&gt;
            &lt;div class=&quot;cards c2&quot;&gt;
              &lt;div class=&quot;terminal&quot;&gt;
                &lt;div class=&quot;term-head&quot;&gt;
                  &lt;span class=&quot;term-dot&quot;&gt;&lt;/span&gt;&lt;span class=&quot;term-dot&quot;&gt;&lt;/span
                  &gt;&lt;span class=&quot;term-dot&quot;&gt;&lt;/span
                  &gt;&lt;span class=&quot;term-title&quot;&gt;the everyday Git loop&lt;/span&gt;
                &lt;/div&gt;
                &lt;pre
                  class=&quot;code&quot;
                &gt;&lt;span class=&quot;prompt&quot;&gt;$&lt;/span&gt; git status                 &lt;span class=&quot;comment&quot;&gt;# changed files&lt;/span&gt;
&lt;span class=&quot;prompt&quot;&gt;$&lt;/span&gt; git diff                   &lt;span class=&quot;comment&quot;&gt;# changed lines&lt;/span&gt;
&lt;span class=&quot;prompt&quot;&gt;$&lt;/span&gt; git add compose.yaml .env.example
&lt;span class=&quot;prompt&quot;&gt;$&lt;/span&gt; git diff --staged          &lt;span class=&quot;comment&quot;&gt;# next snapshot&lt;/span&gt;
&lt;span class=&quot;prompt&quot;&gt;$&lt;/span&gt; git commit -m &quot;Add local Postgres setup&quot;
&lt;span class=&quot;prompt&quot;&gt;$&lt;/span&gt; git push                   &lt;span class=&quot;comment&quot;&gt;# send commits online&lt;/span&gt;&lt;/pre&gt;
              &lt;/div&gt;
              &lt;div&gt;
                &lt;div class=&quot;card&quot;&gt;
                  &lt;span class=&quot;eyebrow&quot;&gt;Before the commit&lt;/span&gt;
                  &lt;h3&gt;Choose and inspect the files&lt;/h3&gt;
                  &lt;p&gt;
                    Use &lt;span class=&quot;mono&quot;&gt;status&lt;/span&gt; and
                    &lt;span class=&quot;mono&quot;&gt;diff&lt;/span&gt;. Do not add everything
                    automatically until you know what changed.
                  &lt;/p&gt;
                &lt;/div&gt;
                &lt;div class=&quot;card&quot; style=&quot;margin-top: 12px&quot;&gt;
                  &lt;span class=&quot;eyebrow&quot;&gt;Name the result&lt;/span&gt;
                  &lt;h3&gt;Describe the useful outcome&lt;/h3&gt;
                  &lt;p&gt;
                    &lt;span class=&quot;mono&quot;&gt;Add local Postgres setup&lt;/span&gt; helps a
                    reviewer. &lt;span class=&quot;mono&quot;&gt;updates&lt;/span&gt; does not.
                  &lt;/p&gt;
                &lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;strip&quot;&gt;
              &lt;b&gt;A useful rhythm:&lt;/b&gt; make a small change → check it → inspect
              the diff → commit the working stage.
            &lt;/div&gt;
            &lt;div class=&quot;speaker-notes&quot;&gt;
              4 min. Explain status, diff, add, commit, and push. Emphasise that
              editor Git panels show the same states. The new title is the main
              lesson: commits should make a change easier to understand, review,
              and undo.
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section
            class=&quot;slide&quot;
            data-chapter=&quot;Project basics&quot;
            data-nav=&quot;Keep Git clean&quot;
          &gt;
            &lt;div class=&quot;kick&quot;&gt;Share instructions, not generated weight&lt;/div&gt;
            &lt;h1&gt;Keep generated files—and secrets—out of Git&lt;/h1&gt;
            &lt;p class=&quot;sub&quot;&gt;
              &lt;span class=&quot;mono&quot;&gt;.gitignore&lt;/span&gt; lists untracked files and
              folders that should normally stay only on your computer.
            &lt;/p&gt;
            &lt;div class=&quot;cards c3&quot;&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;eyebrow r&quot;&gt;Do not commit&lt;/span&gt;
                &lt;pre class=&quot;code&quot;&gt;
node_modules/
.venv/
.env
*.log&lt;/pre
                &gt;
                &lt;p class=&quot;cap&quot;&gt;
                  Downloaded packages, local environments, passwords, API keys,
                  and temporary output.
                &lt;/p&gt;
              &lt;/div&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;&gt;Do commit&lt;/span&gt;
                &lt;pre class=&quot;code&quot;&gt;
package.json
package-lock.json
requirements.txt
.env.example
.gitignore&lt;/pre
                &gt;
                &lt;p class=&quot;cap&quot;&gt;
                  Small files that describe what another developer must
                  recreate.
                &lt;/p&gt;
              &lt;/div&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;&gt;Example .gitignore&lt;/span&gt;
                &lt;pre class=&quot;code&quot;&gt;&lt;span class=&quot;comment&quot;&gt;# dependencies&lt;/span&gt;
node_modules/
.venv/

&lt;span class=&quot;comment&quot;&gt;# local secrets&lt;/span&gt;
.env
.env.*
!.env.example&lt;/pre&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;strip&quot;&gt;
              &lt;b&gt;Why not &lt;span class=&quot;mono&quot;&gt;node_modules&lt;/span&gt;?&lt;/b&gt;
              &lt;span class=&quot;mono&quot;&gt;npm install&lt;/span&gt; recreates it from the
              package files. &lt;b&gt;Why not &lt;span class=&quot;mono&quot;&gt;.env&lt;/span&gt;?&lt;/b&gt; It
              can contain credentials. We will return to secret handling after
              databases.
            &lt;/div&gt;
            &lt;p class=&quot;bottom-line&quot;&gt;
              &lt;span class=&quot;mono&quot;&gt;.gitignore&lt;/span&gt; does not remove a file Git
              already tracks. Untrack it once, inspect the change, and commit
              that removal.
            &lt;/p&gt;
            &lt;div class=&quot;speaker-notes&quot;&gt;
              5 min. Address the real assignment issue: node_modules may contain
              thousands of downloaded files. Commit the package and lock files
              instead. Mention that .env may contain credentials, but save the
              full secret explanation for the later slide. If a folder is
              already tracked, add the ignore rule, use git rm -r --cached for
              that folder, inspect status, and commit.
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section
            class=&quot;slide&quot;
            data-chapter=&quot;Project basics&quot;
            data-nav=&quot;Branch and review&quot;
          &gt;
            &lt;div class=&quot;kick&quot;&gt;Give one change its own lane&lt;/div&gt;
            &lt;h1&gt;A branch separates work; a pull request explains it&lt;/h1&gt;
            &lt;p class=&quot;sub&quot;&gt;
              Branches keep unfinished changes away from the shared baseline. A
              pull request creates a place to review before merging.
            &lt;/p&gt;
            &lt;div class=&quot;git-graph-layout&quot;&gt;
              &lt;div class=&quot;terminal&quot;&gt;
                &lt;div class=&quot;term-head&quot;&gt;
                  &lt;span class=&quot;term-dot&quot;&gt;&lt;/span&gt;&lt;span class=&quot;term-dot&quot;&gt;&lt;/span
                  &gt;&lt;span class=&quot;term-dot&quot;&gt;&lt;/span
                  &gt;&lt;span class=&quot;term-title&quot;
                    &gt;example: view every branch as a graph&lt;/span
                  &gt;
                &lt;/div&gt;
                &lt;pre
                  class=&quot;code&quot;
                &gt;&lt;span class=&quot;prompt&quot;&gt;$&lt;/span&gt; git log --graph --oneline --all --decorate
&lt;span class=&quot;graph-main&quot;&gt;*&lt;/span&gt;   9fd32ab &lt;span class=&quot;g&quot;&gt;(HEAD -&amp;gt; main)&lt;/span&gt; Merge pull request #12
&lt;span class=&quot;graph-path&quot;&gt;|\&lt;/span&gt;
&lt;span class=&quot;graph-path&quot;&gt;|&lt;/span&gt; &lt;span class=&quot;graph-feature&quot;&gt;*&lt;/span&gt; 347c4d1 &lt;span class=&quot;y&quot;&gt;(connect-postgres)&lt;/span&gt; Connect database
&lt;span class=&quot;graph-path&quot;&gt;|&lt;/span&gt; &lt;span class=&quot;graph-feature&quot;&gt;*&lt;/span&gt; a8e02be Add Postgres config
&lt;span class=&quot;graph-path&quot;&gt;|/&lt;/span&gt;
&lt;span class=&quot;graph-main&quot;&gt;*&lt;/span&gt; 2bd91ac Add task API
&lt;span class=&quot;graph-main&quot;&gt;*&lt;/span&gt; c4107ef Start project&lt;/pre&gt;
              &lt;/div&gt;
              &lt;div class=&quot;card graph-legend&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;&gt;How to read the lines&lt;/span&gt;
                &lt;div class=&quot;legend-row&quot;&gt;
                  &lt;code&gt;*&lt;/code
                  &gt;&lt;span&gt;Each dot is one commit—a saved checkpoint.&lt;/span&gt;
                &lt;/div&gt;
                &lt;div class=&quot;legend-row&quot;&gt;
                  &lt;code&gt;\&lt;/code
                  &gt;&lt;span&gt;The feature branch leaves the main line of work.&lt;/span&gt;
                &lt;/div&gt;
                &lt;div class=&quot;legend-row&quot;&gt;
                  &lt;code&gt;/&lt;/code
                  &gt;&lt;span&gt;The feature branch returns through a merge.&lt;/span&gt;
                &lt;/div&gt;
                &lt;pre
                  class=&quot;branch-commands&quot;
                &gt;&lt;span class=&quot;comment&quot;&gt;# create and publish the branch&lt;/span&gt;
git switch -c connect-postgres
git push -u origin connect-postgres&lt;/pre&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;strip&quot;&gt;
              &lt;b&gt;Read the graph from bottom to top:&lt;/b&gt; work begins on
              &lt;span class=&quot;mono&quot;&gt;main&lt;/span&gt; → the feature branch adds two
              commits → the pull request merges the lines. A useful pull request
              explains what changed and how it was checked.
            &lt;/div&gt;
            &lt;div class=&quot;speaker-notes&quot;&gt;
              4 min. Read the graph from bottom to top. Each star is a commit.
              After Add task API, connect-postgres leaves the main line, adds
              two focused commits, and returns at the merge commit. Explain that
              Git graphs are a compact view of history, not a picture of
              folders. A pull request is a feature of GitHub and similar
              platforms, not a Git command; it creates the review conversation
              before the lines are merged.
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section
            class=&quot;slide&quot;
            data-chapter=&quot;Where data lives&quot;
            data-nav=&quot;What is a database?&quot;
          &gt;
            &lt;div class=&quot;kick&quot;&gt;Give the application memory&lt;/div&gt;
            &lt;h1&gt;A database is a separate system built to remember&lt;/h1&gt;
            &lt;p class=&quot;sub&quot;&gt;
              Program memory is temporary. A database keeps information after
              the application stops and helps many requests use it safely.
            &lt;/p&gt;
            &lt;div class=&quot;cards c2&quot;&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;eyebrow y&quot;&gt;Without a database&lt;/span&gt;
                &lt;h3&gt;A whiteboard that is wiped clean&lt;/h3&gt;
                &lt;p&gt;
                  Data in an array or variable exists only while the process is
                  running. Restart the server and the information disappears.
                &lt;/p&gt;
              &lt;/div&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;&gt;With a database&lt;/span&gt;
                &lt;h3&gt;An organised filing system that persists&lt;/h3&gt;
                &lt;p&gt;
                  A database stores data on durable media, finds it efficiently,
                  applies rules, and coordinates access from many users.
                &lt;/p&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;cards c4 compact-cards&quot;&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;&gt;Persist&lt;/span&gt;
                &lt;h3&gt;Keep data&lt;/h3&gt;
                &lt;p class=&quot;cap&quot;&gt;Tasks and users survive restarts.&lt;/p&gt;
              &lt;/div&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;&gt;Organise&lt;/span&gt;
                &lt;h3&gt;Give structure&lt;/h3&gt;
                &lt;p class=&quot;cap&quot;&gt;Names, types, relationships, and rules.&lt;/p&gt;
              &lt;/div&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;&gt;Query&lt;/span&gt;
                &lt;h3&gt;Ask questions&lt;/h3&gt;
                &lt;p class=&quot;cap&quot;&gt;Find, combine, count, update, and delete.&lt;/p&gt;
              &lt;/div&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;&gt;Coordinate&lt;/span&gt;
                &lt;h3&gt;Handle many users&lt;/h3&gt;
                &lt;p class=&quot;cap&quot;&gt;Protect data during concurrent requests.&lt;/p&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;strip&quot;&gt;
              &lt;b&gt;Normal path:&lt;/b&gt; client asks the API → backend applies the
              rules → database stores or returns the data. The database is the
              durable source of truth.
            &lt;/div&gt;
            &lt;div class=&quot;speaker-notes&quot;&gt;
              5 min. Combine the strongest parts of both earlier slides. Start
              with the familiar array example, then use the whiteboard and
              filing-system comparison. Explain the four jobs briefly. The
              client normally talks to the backend, not directly to the
              database.
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section
            class=&quot;slide&quot;
            data-chapter=&quot;Where data lives&quot;
            data-nav=&quot;Relational databases&quot;
          &gt;
            &lt;div class=&quot;kick&quot;&gt;The classic safe default&lt;/div&gt;
            &lt;h1&gt;Relational databases protect connected data&lt;/h1&gt;
            &lt;p class=&quot;sub&quot;&gt;
              Data lives in tables with a defined schema. Keys connect records,
              and SQL asks questions across them.
            &lt;/p&gt;
            &lt;div
              class=&quot;relation-example&quot;
              aria-label=&quot;One user related to many tasks&quot;
            &gt;
              &lt;div class=&quot;mini-db-table user-table&quot;&gt;
                &lt;div class=&quot;db-table-title&quot;&gt;USERS&lt;/div&gt;
                &lt;div class=&quot;db-row header&quot;&gt;
                  &lt;span&gt;id · PK&lt;/span&gt;&lt;span&gt;name&lt;/span&gt;
                &lt;/div&gt;
                &lt;div class=&quot;db-row&quot;&gt;&lt;span&gt;42&lt;/span&gt;&lt;span&gt;Amina&lt;/span&gt;&lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;relation-link&quot;&gt;
                &lt;strong&gt;one user&lt;/strong&gt;&lt;span class=&quot;relation-arrow&quot;&gt;→&lt;/span
                &gt;&lt;strong&gt;many tasks&lt;/strong
                &gt;&lt;small
                  &gt;&lt;span class=&quot;mono&quot;&gt;tasks.user_id&lt;/span&gt;&lt;br /&gt;references
                  &lt;span class=&quot;mono&quot;&gt;users.id&lt;/span&gt;&lt;/small
                &gt;
              &lt;/div&gt;
              &lt;div class=&quot;mini-db-table task-table&quot;&gt;
                &lt;div class=&quot;db-table-title&quot;&gt;TASKS&lt;/div&gt;
                &lt;div class=&quot;db-row header&quot;&gt;
                  &lt;span&gt;id · PK&lt;/span&gt;&lt;span&gt;title&lt;/span
                  &gt;&lt;span&gt;user_id · FK&lt;/span&gt;
                &lt;/div&gt;
                &lt;div class=&quot;db-row&quot;&gt;
                  &lt;span&gt;201&lt;/span&gt;&lt;span&gt;Build API&lt;/span&gt;&lt;span&gt;42&lt;/span&gt;
                &lt;/div&gt;
                &lt;div class=&quot;db-row&quot;&gt;
                  &lt;span&gt;202&lt;/span&gt;&lt;span&gt;Fix login&lt;/span&gt;&lt;span&gt;42&lt;/span&gt;
                &lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;cards c2 pros-cons&quot;&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;&gt;Good at&lt;/span&gt;
                &lt;h3&gt;Correctness and rich questions&lt;/h3&gt;
                &lt;ul class=&quot;checklist&quot;&gt;
                  &lt;li&gt;Strict types and constraints reject invalid data&lt;/li&gt;
                  &lt;li&gt;JOINs combine related tables without copying facts&lt;/li&gt;
                  &lt;li&gt;Transactions protect multi-step changes&lt;/li&gt;
                  &lt;li&gt;SQL knowledge transfers across products&lt;/li&gt;
                &lt;/ul&gt;
              &lt;/div&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;eyebrow y&quot;&gt;Watch out&lt;/span&gt;
                &lt;h3&gt;Structure requires planning&lt;/h3&gt;
                &lt;ul class=&quot;trade-list&quot;&gt;
                  &lt;li&gt;Tables and relationships need thoughtful design&lt;/li&gt;
                  &lt;li&gt;Schema changes require controlled migrations&lt;/li&gt;
                  &lt;li&gt;Very large distributed workloads add complexity&lt;/li&gt;
                  &lt;li&gt;Poor queries still need indexes and tuning&lt;/li&gt;
                &lt;/ul&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;p class=&quot;bottom-line&quot;&gt;
              &lt;b&gt;Rule of thumb:&lt;/b&gt; for most connected application data, start
              with PostgreSQL unless you have a clear reason not to. Other
              examples include MySQL, MariaDB, SQL Server, and SQLite.
            &lt;/p&gt;
            &lt;div class=&quot;speaker-notes&quot;&gt;
              6 min. Use the tables first. users.id is a primary key: it
              uniquely identifies Amina. tasks.user_id is a foreign key: the
              value 42 points back to Amina. Because both tasks contain 42, this
              is one user to many tasks. A JOIN can return the user name with
              each task without copying Amina into every task row. Then cover
              the strengths, planning trade-offs, and the transaction example.
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section
            class=&quot;slide compact-slide&quot;
            data-chapter=&quot;Where data lives&quot;
            data-nav=&quot;Non-relational databases&quot;
          &gt;
            &lt;div class=&quot;kick&quot;&gt;A family of specialised models&lt;/div&gt;
            &lt;h1&gt;NoSQL is a toolbox, not one database design&lt;/h1&gt;
            &lt;p class=&quot;sub&quot;&gt;
              Different non-relational models trade some relational structure
              for flexibility, access speed, or distribution across machines.
            &lt;/p&gt;
            &lt;div class=&quot;cards c2 nosql-example&quot;&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;
                  &gt;Document example · same user and tasks&lt;/span
                &gt;
                &lt;pre class=&quot;code document-code&quot;&gt;{
  &lt;span class=&quot;g&quot;&gt;&quot;_id&quot;&lt;/span&gt;: 42,
  &lt;span class=&quot;g&quot;&gt;&quot;name&quot;&lt;/span&gt;: &lt;span class=&quot;y&quot;&gt;&quot;Amina&quot;&lt;/span&gt;,
  &lt;span class=&quot;g&quot;&gt;&quot;tasks&quot;&lt;/span&gt;: [
    { &lt;span class=&quot;g&quot;&gt;&quot;id&quot;&lt;/span&gt;: 201, &lt;span class=&quot;g&quot;&gt;&quot;title&quot;&lt;/span&gt;: &lt;span class=&quot;y&quot;&gt;&quot;Build API&quot;&lt;/span&gt; },
    { &lt;span class=&quot;g&quot;&gt;&quot;id&quot;&lt;/span&gt;: 202, &lt;span class=&quot;g&quot;&gt;&quot;title&quot;&lt;/span&gt;: &lt;span class=&quot;y&quot;&gt;&quot;Fix login&quot;&lt;/span&gt; }
  ]
}&lt;/pre&gt;
              &lt;/div&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;&gt;Why store it this way?&lt;/span&gt;
                &lt;div class=&quot;example-point&quot;&gt;
                  &lt;b&gt;Read together&lt;/b
                  &gt;&lt;span
                    &gt;The user and a small task list can be returned from one
                    document without a JOIN.&lt;/span
                  &gt;
                &lt;/div&gt;
                &lt;div class=&quot;example-point&quot;&gt;
                  &lt;b&gt;Flexible shape&lt;/b
                  &gt;&lt;span
                    &gt;Another user document may contain an extra field without
                    changing every record.&lt;/span
                  &gt;
                &lt;/div&gt;
                &lt;div class=&quot;example-point warn&quot;&gt;
                  &lt;b&gt;Watch out&lt;/b
                  &gt;&lt;span
                    &gt;Large arrays, duplicated facts, or independently updated
                    tasks may belong in separate documents or references.&lt;/span
                  &gt;
                &lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;nosql-family-line&quot;&gt;
              &lt;div class=&quot;family-chip&quot;&gt;
                &lt;b&gt;Document · MongoDB&lt;/b&gt;&lt;span&gt;flexible records&lt;/span&gt;
              &lt;/div&gt;
              &lt;div class=&quot;family-chip&quot;&gt;
                &lt;b&gt;Key–value · Redis&lt;/b&gt;&lt;span&gt;fast lookup and cache&lt;/span&gt;
              &lt;/div&gt;
              &lt;div class=&quot;family-chip&quot;&gt;
                &lt;b&gt;Graph · Neo4j&lt;/b&gt;&lt;span&gt;relationship queries&lt;/span&gt;
              &lt;/div&gt;
              &lt;div class=&quot;family-chip&quot;&gt;
                &lt;b&gt;Wide-column · Cassandra&lt;/b&gt;&lt;span&gt;distributed writes&lt;/span&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;strip&quot;&gt;
              &lt;b&gt;Real systems often mix tools:&lt;/b&gt; PostgreSQL owns durable
              business truth; Redis keeps temporary fast copies; a document
              store may serve naturally document-shaped content.
            &lt;/div&gt;
            &lt;div class=&quot;speaker-notes&quot;&gt;
              6 min. Reuse the same Amina example from the relational slide.
              Here the two tasks are embedded inside one user document, so one
              read can return the data together without a JOIN. This can be
              convenient when the data is normally read together. It is not
              automatically better: growing arrays, duplicated facts, and
              independently updated data may need separate documents or
              references. Then show that document is only one NoSQL model and
              quickly name key-value, graph, and wide-column.
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section
            class=&quot;slide compact-slide&quot;
            data-chapter=&quot;Where data lives&quot;
            data-nav=&quot;ORMs&quot;
          &gt;
            &lt;div class=&quot;kick&quot;&gt;Connect code to relational data&lt;/div&gt;
            &lt;h1&gt;An ORM translates application code into database queries&lt;/h1&gt;
            &lt;p class=&quot;sub&quot;&gt;
              You can write SQL directly—or use an Object-Relational Mapper to
              express common database work in your programming language.
            &lt;/p&gt;
            &lt;div class=&quot;cards c2&quot;&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;&gt;What it does&lt;/span&gt;
                &lt;h3&gt;Maps models and operations&lt;/h3&gt;
                &lt;p&gt;
                  An ORM maps application objects or models to tables and turns
                  operations into SQL.
                &lt;/p&gt;
                &lt;p class=&quot;cap&quot; style=&quot;margin-top: 8px&quot;&gt;
                  JavaScript: Prisma, Sequelize · Python: SQLAlchemy, Django ORM
                  · Java: Hibernate · C#: Entity Framework
                &lt;/p&gt;
              &lt;/div&gt;
              &lt;pre class=&quot;code&quot;&gt;&lt;span class=&quot;comment&quot;&gt;-- SQL&lt;/span&gt;
SELECT * FROM users
WHERE id = 1;

&lt;span class=&quot;comment&quot;&gt;// ORM-style call&lt;/span&gt;
users.findById(1)&lt;/pre&gt;
            &lt;/div&gt;
            &lt;div class=&quot;cards c2 pros-cons tight&quot;&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;&gt;Good at&lt;/span&gt;
                &lt;p&gt;
                  Less repetitive CRUD code · migrations and models in one
                  workflow · type checks and autocomplete in some tools · safer
                  parameter handling.
                &lt;/p&gt;
              &lt;/div&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;eyebrow y&quot;&gt;Watch out&lt;/span&gt;
                &lt;p&gt;
                  The abstraction can hide expensive queries · complex SQL may
                  be awkward · switching databases is rarely automatic · the ORM
                  still needs database knowledge.
                &lt;/p&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;strip&quot;&gt;
              &lt;b&gt;Practical advice:&lt;/b&gt; learn enough SQL to understand what the
              ORM generates. Use the abstraction, but keep responsibility for
              the query.
            &lt;/div&gt;
            &lt;div class=&quot;speaker-notes&quot;&gt;
              4 min. Keep the translator model. The exact ORM depends on the
              language and project. ORMs improve productivity, but they do not
              remove the need to understand tables, relationships, SQL, and
              query performance.
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section
            class=&quot;slide&quot;
            data-chapter=&quot;Where data lives&quot;
            data-nav=&quot;Environment secrets&quot;
          &gt;
            &lt;div class=&quot;kick&quot;&gt;Connect without publishing credentials&lt;/div&gt;
            &lt;h1&gt;
              &lt;span class=&quot;mono&quot;&gt;.env&lt;/span&gt; is local configuration—not
              repository content
            &lt;/h1&gt;
            &lt;p class=&quot;sub&quot;&gt;
              Database passwords, API keys, and tokens must not be written into
              shared source code.
            &lt;/p&gt;
            &lt;div class=&quot;cards c3&quot;&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;eyebrow r&quot;&gt;Local .env&lt;/span&gt;
                &lt;pre class=&quot;code&quot;&gt;
DATABASE_URL=postgresql://
  app:real-password@
  localhost:5432/tasks&lt;/pre
                &gt;
                &lt;p class=&quot;cap&quot;&gt;
                  Contains a real local value. Keep it out of Git.
                &lt;/p&gt;
              &lt;/div&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;&gt;Shared .env.example&lt;/span&gt;
                &lt;pre class=&quot;code&quot;&gt;
DATABASE_URL=postgresql://
  app:change-me@
  localhost:5432/tasks&lt;/pre
                &gt;
                &lt;p class=&quot;cap&quot;&gt;
                  Shows every required name with a safe placeholder.
                &lt;/p&gt;
              &lt;/div&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;&gt;Shared .gitignore&lt;/span&gt;
                &lt;pre class=&quot;code&quot;&gt;
.env
.env.*
!.env.example&lt;/pre
                &gt;
                &lt;p class=&quot;cap&quot;&gt;
                  Keeps local variants out and allows the example.
                &lt;/p&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;strip&quot;&gt;
              &lt;b&gt;If a real secret was pushed:&lt;/b&gt; revoke or rotate it
              immediately. A later deletion does not remove the value from Git
              history.
            &lt;/div&gt;
            &lt;p class=&quot;bottom-line&quot;&gt;
              Always inspect &lt;span class=&quot;mono&quot;&gt;git status&lt;/span&gt; and
              &lt;span class=&quot;mono&quot;&gt;git diff --staged&lt;/span&gt; before you push.
            &lt;/p&gt;
            &lt;div class=&quot;speaker-notes&quot;&gt;
              5 min. Environment variables separate configuration from code. A
              .env file is a convenient local mechanism, not a security system
              by itself. Commit .env.example so teammates know which values to
              provide. If a secret reaches a remote repository, treat it as
              exposed and rotate it first.
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section
            class=&quot;slide compact-slide docker-slide&quot;
            data-chapter=&quot;Run the environment&quot;
            data-nav=&quot;Docker concepts&quot;
          &gt;
            &lt;div class=&quot;kick&quot;&gt;Ship the environment&lt;/div&gt;
            &lt;h1&gt;Docker makes a development environment repeatable&lt;/h1&gt;
            &lt;p class=&quot;sub&quot;&gt;
              Instead of every computer installing and configuring services
              differently, the project describes a consistent environment.
              Select a concept for the deeper explanation.
            &lt;/p&gt;
            &lt;div class=&quot;cards c4 docker-concepts&quot;&gt;
              &lt;div class=&quot;card docker-card&quot; data-docker-topic=&quot;image&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;&gt;Image&lt;/span&gt;
                &lt;h3&gt;A reusable, layered package&lt;/h3&gt;
                &lt;p class=&quot;cap&quot;&gt;
                  Contains the filesystem and runtime needed to start a service.
                  Built once; used many times.
                &lt;/p&gt;
              &lt;/div&gt;
              &lt;div class=&quot;card docker-card&quot; data-docker-topic=&quot;container&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;&gt;Container&lt;/span&gt;
                &lt;h3&gt;A running isolated process&lt;/h3&gt;
                &lt;p class=&quot;cap&quot;&gt;
                  Created from an image. Many identical containers can start
                  from the same package.
                &lt;/p&gt;
              &lt;/div&gt;
              &lt;div class=&quot;card docker-card&quot; data-docker-topic=&quot;port&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;&gt;Port&lt;/span&gt;
                &lt;h3&gt;A network forwarding rule&lt;/h3&gt;
                &lt;p class=&quot;cap&quot;&gt;
                  &lt;span class=&quot;mono&quot;&gt;5432:5432&lt;/span&gt; forwards a host port to a
                  service inside the container.
                &lt;/p&gt;
              &lt;/div&gt;
              &lt;div class=&quot;card docker-card&quot; data-docker-topic=&quot;volume&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;&gt;Volume&lt;/span&gt;
                &lt;h3&gt;Storage with its own lifecycle&lt;/h3&gt;
                &lt;p class=&quot;cap&quot;&gt;
                  Keeps database files outside the disposable container layer.
                &lt;/p&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;detail-panel&quot; id=&quot;docker-detail&quot; aria-live=&quot;polite&quot;&gt;
              &lt;span class=&quot;detail-label&quot;&gt;Select a concept&lt;/span
              &gt;&lt;strong&gt;Open the detail behind the Docker vocabulary.&lt;/strong&gt;
              &lt;p&gt;
                Each term answers a different question: what is packaged, what
                is running, how traffic enters, and where data survives.
              &lt;/p&gt;
            &lt;/div&gt;
            &lt;div class=&quot;strip&quot;&gt;
              &lt;b&gt;The convenience:&lt;/b&gt; clone the project, provide local
              environment values, run one command, and receive the expected
              versions. The Docker resource video will provide the slower
              walkthrough.
            &lt;/div&gt;
            &lt;div class=&quot;speaker-notes&quot;&gt;
              6 min. Focus on convenience, then select each concept. Image:
              immutable layers, tag, registry. Container: isolated process plus
              disposable writable layer. Port: explicit host-to-container
              forwarding. Volume: data stored beyond a container&#x27;s lifecycle.
              Avoid describing a container as a tiny virtual machine.
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section
            class=&quot;slide docker-flow-slide&quot;
            data-chapter=&quot;Run the environment&quot;
            data-nav=&quot;How Docker works&quot;
          &gt;
            &lt;div class=&quot;kick&quot;&gt;What Docker actually does&lt;/div&gt;
            &lt;h1&gt;Docker creates a repeatable environment&lt;/h1&gt;
            &lt;p class=&quot;sub&quot;&gt;
              The project describes what it needs. Docker turns that description
              into isolated, connected services that can be recreated on another
              machine.
            &lt;/p&gt;
            &lt;div class=&quot;docker-workflow&quot;&gt;
              &lt;div class=&quot;card workflow-card&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;&gt;1 · Describe&lt;/span&gt;
                &lt;h3&gt;Project files state what is needed&lt;/h3&gt;
                &lt;ul class=&quot;workflow-file-list&quot;&gt;
                  &lt;li&gt;
                    &lt;span class=&quot;mono&quot;&gt;Dockerfile&lt;/span&gt; · build the application
                    image
                  &lt;/li&gt;
                  &lt;li&gt;
                    &lt;span class=&quot;mono&quot;&gt;compose.yaml&lt;/span&gt; · define the services
                  &lt;/li&gt;
                  &lt;li&gt;
                    &lt;span class=&quot;mono&quot;&gt;.env&lt;/span&gt; · provide local configuration
                  &lt;/li&gt;
                &lt;/ul&gt;
              &lt;/div&gt;
              &lt;div class=&quot;workflow-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
              &lt;div class=&quot;card engine-card&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;&gt;2 · Prepare&lt;/span&gt;
                &lt;h3&gt;Docker Engine reads the instructions&lt;/h3&gt;
                &lt;div class=&quot;engine-actions&quot;&gt;
                  &lt;span
                    &gt;&lt;b&gt;Finds or builds images&lt;/b&gt; with the requested
                    versions&lt;/span
                  &gt;
                  &lt;span
                    &gt;&lt;b&gt;Creates containers&lt;/b&gt; as isolated running
                    processes&lt;/span
                  &gt;
                  &lt;span
                    &gt;&lt;b&gt;Connects networking and storage&lt;/b&gt; for the
                    project&lt;/span
                  &gt;
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;workflow-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
              &lt;div class=&quot;card workflow-card&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;&gt;3 · Run&lt;/span&gt;
                &lt;h3&gt;The project services start together&lt;/h3&gt;
                &lt;div class=&quot;service-list&quot;&gt;
                  &lt;div class=&quot;service-row&quot;&gt;
                    &lt;span class=&quot;status-light&quot;&gt;&lt;/span&gt;&lt;b&gt;API container&lt;/b
                    &gt;&lt;small&gt;application code + Node runtime&lt;/small&gt;
                  &lt;/div&gt;
                  &lt;div class=&quot;service-row&quot;&gt;
                    &lt;span class=&quot;status-light&quot;&gt;&lt;/span&gt;&lt;b&gt;Postgres container&lt;/b
                    &gt;&lt;small&gt;database files stored in a volume&lt;/small&gt;
                  &lt;/div&gt;
                  &lt;div class=&quot;service-row&quot;&gt;
                    &lt;span class=&quot;status-light&quot;&gt;&lt;/span&gt;&lt;b&gt;Redis container&lt;/b
                    &gt;&lt;small&gt;optional fast cache service&lt;/small&gt;
                  &lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;docker-problems&quot;&gt;
              &lt;div class=&quot;problem-item&quot;&gt;
                &lt;b&gt;Different versions&lt;/b
                &gt;&lt;span
                  &gt;Pinned images give the team the expected runtime and service
                  versions.&lt;/span
                &gt;
              &lt;/div&gt;
              &lt;div class=&quot;problem-item&quot;&gt;
                &lt;b&gt;Long manual setup&lt;/b
                &gt;&lt;span
                  &gt;One documented command can start the complete local
                  environment.&lt;/span
                &gt;
              &lt;/div&gt;
              &lt;div class=&quot;problem-item&quot;&gt;
                &lt;b&gt;Dependency conflicts&lt;/b
                &gt;&lt;span
                  &gt;Each service keeps its own user-space files and
                  dependencies.&lt;/span
                &gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;strip&quot;&gt;
              &lt;b&gt;Why it matters:&lt;/b&gt; “it works on my machine” becomes a set of
              instructions another machine can repeat.
            &lt;/div&gt;
            &lt;div class=&quot;speaker-notes&quot;&gt;
              5 min. Follow the visual from left to right. First the project
              describes the environment. Then Docker finds or builds images,
              creates isolated containers, and connects their network and
              storage. Finally the API, database, and optional cache run as
              separate services. Emphasise the three practical problems: version
              differences, long setup instructions, and dependency conflicts.
              Keep the VM comparison to the final sentence only: a VM packages a
              full guest operating system, while containers share the host
              kernel.
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section
            class=&quot;slide compact-slide compose-slide&quot;
            data-chapter=&quot;Run the environment&quot;
            data-nav=&quot;Docker Compose&quot;
          &gt;
            &lt;div class=&quot;kick&quot;&gt;Describe the setup once&lt;/div&gt;
            &lt;h1&gt;Compose turns a local Postgres setup into one command&lt;/h1&gt;
            &lt;p class=&quot;sub&quot;&gt;
              The shared file describes the service. Each developer supplies
              their own ignored local password.
            &lt;/p&gt;
            &lt;div class=&quot;cards c2 compose-layout&quot;&gt;
              &lt;div&gt;
                &lt;div
                  class=&quot;tabs&quot;
                  role=&quot;tablist&quot;
                  aria-label=&quot;Compose example tabs&quot;
                &gt;
                  &lt;button
                    class=&quot;tab on&quot;
                    data-tab-group=&quot;compose-final&quot;
                    data-tab-target=&quot;compose-final-file&quot;
                  &gt;
                    compose.yaml
                  &lt;/button&gt;
                  &lt;button
                    class=&quot;tab&quot;
                    data-tab-group=&quot;compose-final&quot;
                    data-tab-target=&quot;compose-final-env&quot;
                  &gt;
                    .env
                  &lt;/button&gt;
                &lt;/div&gt;
                &lt;div
                  class=&quot;tab-panel on&quot;
                  id=&quot;compose-final-file&quot;
                  data-tab-panel=&quot;compose-final&quot;
                &gt;
                  &lt;pre class=&quot;code&quot;&gt;
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: app
      POSTGRES_PASSWORD: &amp;#36;{POSTGRES_PASSWORD}
    ports:
      - &quot;5432:5432&quot;
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:&lt;/pre
                  &gt;
                &lt;/div&gt;
                &lt;div
                  class=&quot;tab-panel&quot;
                  id=&quot;compose-final-env&quot;
                  data-tab-panel=&quot;compose-final&quot;
                &gt;
                  &lt;pre
                    class=&quot;code&quot;
                  &gt;&lt;span class=&quot;comment&quot;&gt;# .env — local and ignored&lt;/span&gt;
POSTGRES_PASSWORD=local-only-password

&lt;span class=&quot;comment&quot;&gt;# backend running on the host machine&lt;/span&gt;
DATABASE_URL=postgresql://app:
  local-only-password@localhost:5432/tasks&lt;/pre&gt;
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div&gt;
                &lt;div class=&quot;card compose-explain&quot;&gt;
                  &lt;span class=&quot;eyebrow&quot;&gt;What the file controls&lt;/span&gt;
                  &lt;p&gt;&lt;b&gt;service&lt;/b&gt; gives the container a stable name.&lt;/p&gt;
                  &lt;p&gt;&lt;b&gt;image&lt;/b&gt; pins the Postgres version.&lt;/p&gt;
                  &lt;p&gt;&lt;b&gt;environment&lt;/b&gt; configures first startup.&lt;/p&gt;
                  &lt;p&gt;&lt;b&gt;ports&lt;/b&gt; opens Postgres to the host machine.&lt;/p&gt;
                  &lt;p&gt;&lt;b&gt;volume&lt;/b&gt; keeps database files after recreation.&lt;/p&gt;
                &lt;/div&gt;
                &lt;div class=&quot;terminal&quot; style=&quot;margin-top: 12px&quot;&gt;
                  &lt;div class=&quot;term-head&quot;&gt;
                    &lt;span class=&quot;term-dot&quot;&gt;&lt;/span&gt;&lt;span class=&quot;term-dot&quot;&gt;&lt;/span
                    &gt;&lt;span class=&quot;term-dot&quot;&gt;&lt;/span
                    &gt;&lt;span class=&quot;term-title&quot;&gt;start, inspect, stop&lt;/span&gt;
                  &lt;/div&gt;
                  &lt;pre
                    class=&quot;code&quot;
                  &gt;&lt;span class=&quot;prompt&quot;&gt;$&lt;/span&gt; docker compose up -d
&lt;span class=&quot;prompt&quot;&gt;$&lt;/span&gt; docker compose ps
&lt;span class=&quot;prompt&quot;&gt;$&lt;/span&gt; docker compose logs db
&lt;span class=&quot;prompt&quot;&gt;$&lt;/span&gt; docker compose exec db psql -U app -d tasks
&lt;span class=&quot;prompt&quot;&gt;$&lt;/span&gt; docker compose down&lt;/pre&gt;
                &lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;speaker-notes&quot;&gt;
              6 min. Walk through the file in the same order as the concepts
              slide: image, environment, port, volume. Explain up -d, ps, logs,
              exec, and down. Normal down removes the container but keeps the
              named volume. Avoid down -v unless the learner intentionally wants
              to delete the local database data. Add the networking detail
              verbally: an API in the same Compose project connects to host db;
              an API on the laptop connects through localhost and the published
              port.
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section
            class=&quot;slide&quot;
            data-chapter=&quot;Run and speed up&quot;
            data-nav=&quot;Caching&quot;
          &gt;
            &lt;div class=&quot;kick&quot;&gt;Do expensive work once&lt;/div&gt;
            &lt;h1&gt;Caching makes repeated answers faster&lt;/h1&gt;
            &lt;p class=&quot;sub&quot;&gt;
              If work is slow and the same answer will be needed again, keep a
              temporary copy somewhere fast.
            &lt;/p&gt;
            &lt;div class=&quot;cards c2 cache-layout&quot;&gt;
              &lt;div class=&quot;cache-demo&quot;&gt;
                &lt;div class=&quot;cache-actions&quot;&gt;
                  &lt;button class=&quot;action-btn&quot; id=&quot;cache-request&quot;&gt;
                    Send a request
                  &lt;/button&gt;
                  &lt;button class=&quot;action-btn secondary&quot; id=&quot;cache-clear&quot;&gt;
                    Clear cache
                  &lt;/button&gt;
                &lt;/div&gt;
                &lt;div class=&quot;cache-route&quot;&gt;
                  &lt;span class=&quot;cache-node&quot;&gt;Request&lt;/span
                  &gt;&lt;span class=&quot;route-arrow&quot;&gt;→&lt;/span&gt;
                  &lt;span class=&quot;cache-node cache-store&quot;&gt;Cache&lt;/span
                  &gt;&lt;span class=&quot;route-arrow&quot;&gt;⇄&lt;/span&gt;
                  &lt;span class=&quot;cache-node&quot;&gt;Database&lt;/span&gt;
                &lt;/div&gt;
                &lt;div
                  class=&quot;cache-message&quot;
                  id=&quot;cache-message&quot;
                  aria-live=&quot;polite&quot;
                &gt;
                  &lt;b&gt;Try it:&lt;/b&gt; the first request must visit the database. The
                  next request can reuse the copy.
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;&gt;Three words to know&lt;/span&gt;
                &lt;div class=&quot;term-row&quot;&gt;
                  &lt;b&gt;Miss&lt;/b
                  &gt;&lt;span
                    &gt;No copy exists. Do the slow work and save the result.&lt;/span
                  &gt;
                &lt;/div&gt;
                &lt;div class=&quot;term-row&quot;&gt;
                  &lt;b&gt;Hit&lt;/b
                  &gt;&lt;span
                    &gt;The copy exists. Return it through the fast path.&lt;/span
                  &gt;
                &lt;/div&gt;
                &lt;div class=&quot;term-row&quot;&gt;
                  &lt;b&gt;TTL&lt;/b
                  &gt;&lt;span
                    &gt;Time to live: how long the copy may stay before
                    expiry.&lt;/span
                  &gt;
                &lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;why-cache&quot;&gt;
              &lt;span
                &gt;&lt;b&gt;Faster responses&lt;/b
                &gt;&lt;small&gt;less waiting for repeated work&lt;/small&gt;&lt;/span
              &gt;
              &lt;span
                &gt;&lt;b&gt;Fewer database calls&lt;/b
                &gt;&lt;small&gt;protect the source of truth&lt;/small&gt;&lt;/span
              &gt;
              &lt;span
                &gt;&lt;b&gt;More traffic headroom&lt;/b
                &gt;&lt;small&gt;reuse popular results during spikes&lt;/small&gt;&lt;/span
              &gt;
            &lt;/div&gt;
            &lt;div class=&quot;strip&quot;&gt;
              &lt;b&gt;The cost is stale data:&lt;/b&gt; the database can change while the
              copy remains old. Cache where staleness is acceptable, choose a
              TTL deliberately, and invalidate important entries when the source
              changes.
            &lt;/div&gt;
            &lt;div class=&quot;speaker-notes&quot;&gt;
              5 min. Click Send a request twice. First click: miss, database
              work, save copy. Second click: hit, return copy. Then explain why:
              faster response, fewer database calls, more capacity during
              traffic spikes. TTL limits staleness; Redis is a common
              server-side cache.
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section
            class=&quot;slide compact-slide&quot;
            data-chapter=&quot;Managed backend&quot;
            data-nav=&quot;Supabase&quot;
          &gt;
            &lt;div class=&quot;kick&quot;&gt;Bundle the building blocks&lt;/div&gt;
            &lt;h1&gt;Supabase provides a managed backend around PostgreSQL&lt;/h1&gt;
            &lt;p class=&quot;sub&quot;&gt;
              It is not a new database model. Each project includes PostgreSQL
              plus services that remove common backend plumbing.
            &lt;/p&gt;
            &lt;div class=&quot;platform-shell&quot;&gt;
              &lt;div class=&quot;platform-core&quot;&gt;
                &lt;span&gt;Foundation&lt;/span&gt;&lt;strong&gt;PostgreSQL&lt;/strong
                &gt;&lt;small&gt;tables · relationships · SQL · extensions&lt;/small&gt;
              &lt;/div&gt;
              &lt;div class=&quot;platform-services&quot;&gt;
                &lt;div class=&quot;platform-tile&quot;&gt;

                &lt;/div&gt;

                  &lt;b&gt;Storage&lt;/b
                  &gt;&lt;span&gt;files and buckets with access policies&lt;/span&gt;
                &lt;/div&gt;
                &lt;div class=&quot;platform-tile&quot;&gt;
                  &lt;b&gt;Realtime&lt;/b
                  &gt;&lt;span&gt;subscribe to changes and live messages&lt;/span&gt;
                &lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;cards c2 supabase-decisions&quot;&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;eyebrow&quot;&gt;What it can save&lt;/span&gt;
                &lt;p&gt;
                  Database hosting · common authentication flows · file APIs ·
                  generated data APIs · realtime infrastructure · operational
                  setup.
                &lt;/p&gt;
              &lt;/div&gt;
              &lt;div class=&quot;card&quot;&gt;
                &lt;span class=&quot;eyebrow y&quot;&gt;What you still own&lt;/span&gt;
                &lt;p&gt;
                  Data design · validation · access policies · secret keys ·
                  custom business logic · cost and performance decisions.
                &lt;/p&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;security-callout&quot;&gt;
              &lt;b&gt;Security rule:&lt;/b&gt; protect exposed tables with Row-Level
              Security and least-privilege policies. Publishable keys can be
              used by clients with correct RLS; service-role and secret keys
              belong only on trusted backends.
            &lt;/div&gt;
            &lt;p class=&quot;bottom-line&quot;&gt;
              &lt;b&gt;Good fit:&lt;/b&gt; prototypes, dashboards, and data-driven apps that
              need to move quickly. Add your own backend services when business
              logic becomes heavier.
            &lt;/p&gt;
            &lt;div class=&quot;speaker-notes&quot;&gt;
              6 min. Supabase comes last because interns now recognise the
              pieces it bundles. It is a full Postgres database with managed
              services around it. The crucial distinction is between publishable
              client keys protected by RLS and privileged service keys that must
              remain secret. Great for shipping common capabilities quickly;
              custom workflows may still need a dedicated backend.
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section

            data-chapter=&quot;Keep learning&quot;

      function toggleBoxSelection(box) {
        const slide = box.closest(&quot;.slide&quot;);
        const shouldSelect = !box.classList.contains(&quot;is-selected&quot;);

        slide
          .querySelectorAll(&quot;.selectable-box.is-selected&quot;)
          .forEach(function (selectedBox) {
            selectedBox.classList.remove(&quot;is-selected&quot;);
            selectedBox.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
          });

        if (shouldSelect) {
          box.classList.add(&quot;is-selected&quot;);
          box.setAttribute(&quot;aria-pressed&quot;, &quot;true&quot;);
        }
      }

      slides.forEach(function (slide) {
        const boxes = slide.querySelectorAll(
          &quot;.card, .terminal, .layer, .flow .step, .loop span, .platform-tile, .problem-item, .mini-db-table, .family-chip, :scope &gt; .strip, .cards &gt; .code&quot;,

        boxes.forEach(function (box) {
          box.classList.add(&quot;selectable-box&quot;);
          box.tabIndex = 0;
          box.setAttribute(&quot;role&quot;, &quot;button&quot;);
          box.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);

          box.addEventListener(&quot;click&quot;, function () {
            const selectedText = window.getSelection
              ? String(window.getSelection()).trim()
              : &quot;&quot;;
            if (!selectedText) toggleBoxSelection(box);
          });

          box.addEventListener(&quot;keydown&quot;, function (event) {
            if (event.key === &quot;Enter&quot; || event.key === &quot; &quot;) {
              event.preventDefault();
              event.stopPropagation();
              toggleBoxSelection(box);
            }
          });
        });
      });

      slides.forEach(function (slide, index) {
        const chapter = slide.dataset.chapter;
        if (chapter !== lastChapter) {
          const label = document.createElement(&quot;div&quot;);
          label.className = &quot;chapter&quot;;
          label.textContent = chapter;
          links.appendChild(label);
          lastChapter = chapter;
        }
        const link = document.createElement(&quot;a&quot;);
        link.href = &quot;#&quot; + (index + 1);
        link.dataset.index = String(index);
        link.textContent = index + 1 + &quot; · &quot; + slide.dataset.nav;
        links.appendChild(link);
      });

      function show(index) {
        current = Math.max(0, Math.min(slides.length - 1, index));
        slides.forEach(function (slide, slideIndex) {
          slide.classList.toggle(&quot;active&quot;, slideIndex === current);
        });
        document
          .querySelectorAll(&quot;#side a&quot;)
          .forEach(function (link, linkIndex) {
            link.classList.toggle(&quot;on&quot;, linkIndex === current);
          });
        counter.textContent = current + 1 + &quot; / &quot; + slides.length;
        bar.style.width = ((current + 1) / slides.length) * 100 + &quot;%&quot;;
        const note = slides[current].querySelector(&quot;.speaker-notes&quot;);
        notes.innerHTML = &quot;&lt;b&gt;Notes:&lt;/b&gt; &quot; + (note ? note.innerHTML : &quot;&quot;);
        stage.scrollTop = 0;
        const activeLink = document.querySelector(&quot;#side a.on&quot;);
        if (activeLink) activeLink.scrollIntoView({ block: &quot;nearest&quot; });
        history.replaceState(null, &quot;&quot;, &quot;#&quot; + (current + 1));
        renderResources();
      }

      links.addEventListener(&quot;click&quot;, function (event) {
        const link = event.target.closest(&quot;a[data-index]&quot;);

        show(Number(link.dataset.index));

      document.getElementById(&quot;prev&quot;).addEventListener(&quot;click&quot;, function () {
        show(current - 1);
      });

      document.getElementById(&quot;next&quot;).addEventListener(&quot;click&quot;, function () {

        container: {
          label: &quot;Container · what is running&quot;,
          title: &quot;An isolated process with a small writable layer&quot;,
          text: &quot;Starting an image creates a container. Its process, filesystem view, and network are isolated, while the host kernel is shared. You can start many containers from one image. Removing a container removes its writable layer, so durable data needs a volume.&quot;,
        },
        port: {
          label: &quot;Port · how traffic enters&quot;,
          title: &quot;A published port forwards host traffic into isolation&quot;,
          text: &quot;Containers are isolated from the host network by default. A mapping such as 5432:5432 forwards the laptop&#x27;s port 5432 to Postgres inside the container. Publish only the ports that a local user or service actually needs.&quot;,
