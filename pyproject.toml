[project]
name = "crud-api"
version = "1.3.0a2"
description = "FastAPI CRUD API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
]

[tool.fastapi]
entrypoint = "backend.main:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
